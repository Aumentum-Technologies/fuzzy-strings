# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    
    defaults:
      run:
        working-directory: src/DuoVia.FuzzyStrings
        
    steps:
    - uses: actions/checkout@v4
  
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Build (.NET Framework)
      run: msbuild DuoVia.FuzzyStrings.sln /p:Configuration=Release /p:TargetFramework=net462 /v:minimal
      
    #- name: Test
    #  run: dotnet test --no-build --verbosity normal
    
    # Set version dynamically
    - name: Set version
      id: version
      run: |
        if ("${{ github.event_name }}" -eq "pull_request") {
          $version = "2.1.${{ github.run_number }}-pr${{ github.event.pull_request.number }}"
        } else {
          $version = "2.1.${{ github.run_number }}"
        }

        echo "VERSION=$version" >> $env:GITHUB_ENV
    
    # Stage compliant package structure
    - name: Prepare package layout
      run: |
        New-Item -ItemType Directory -Force -Path ../../package/lib/net462
        New-Item -ItemType Directory -Force -Path ../../package/Tools

        # Copy compiled DLLs
        Copy-Item DuoVia.FuzzyStrings/bin/Release/net462/*.dll ../../package/lib/net462/
        Copy-Item DuoVia.FuzzyStrings/bin/Release/net462/*.xml ../../package/lib/net462/

        # Copy Tools
        Copy-Item ../../Tools/*.ps1 ../../package/Tools/

        # Copy nuspec
        Copy-Item ../../nuspec/AT.DuoVia.FuzzyStrings.nuspec ../../package/

    # Inject version into nuspec
    - name: Update nuspec version
      run: |
        (Get-Content ../../package/AT.DuoVia.FuzzyStrings.nuspec) `
          -replace '<version>.*</version>', "<version>$env:VERSION</version>" |
          Set-Content ../../package/AT.DuoVia.FuzzyStrings.nuspec

    # Pack using nuspec (NOT dotnet pack)
    - name: Create NuGet package
      run: |
        cd ../../package
        nuget pack AT.DuoVia.FuzzyStrings.nuspec -OutputDirectory ../nupkgs

    # Upload both .nupkg and .snupkg
    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: |
          nupkgs/*.nupkg