# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    
    defaults:
      run:
        working-directory: src/DuoVia.FuzzyStrings
        
    steps:
    - uses: actions/checkout@v4
  
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore --configuration Release
      
    #- name: Test
    #  run: dotnet test --no-build --verbosity normal

    
    # Set version dynamically
    - name: Set version
      id: version
      run: |
        $shortSha = git rev-parse --short HEAD

        if ("${{ github.event_name }}" -eq "pull_request") {
          $version = "1.0.${{ github.run_number }}-pr${{ github.event.pull_request.number }}-$shortSha"
        } else {
          $version = "1.0.${{ github.run_number }}-$shortSha"
        }

        echo "VERSION=$version" >> $env:GITHUB_ENV
    
    # ✅ Stage compliant package structure
    - name: Prepare package layout
      run: |
        New-Item -ItemType Directory -Force -Path ../../package/lib/net462

        # Copy compiled DLLs
        Copy-Item bin/Release/net462/*.dll ../../package/lib/net462/ -ErrorAction SilentlyContinue
        Copy-Item bin/Release/net462/*.xml ../../package/lib/net462/ -ErrorAction SilentlyContinue


        # Copy nuspec
        Copy-Item ../../nuspec/AT.DuoVia.FuzzyStrings.nuspec ../../package/

    # ✅ Inject version into nuspec
    - name: Update nuspec version
      run: |
        (Get-Content ../../package/AT.DuoVia.FuzzyStrings.nuspec) `
          -replace '<version>.*</version>', "<version>$env:VERSION</version>" |
          Set-Content ../../package/AT.DuoVia.FuzzyStrings.nuspec


    # ✅ Pack using nuspec (NOT dotnet pack)
    - name: Create NuGet package
      run: |
        cd ../../package
        nuget pack AT.DuoVia.FuzzyStrings.nuspec -OutputDirectory ../nupkgs