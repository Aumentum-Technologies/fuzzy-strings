# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: src/DuoVia.FuzzyStrings
        
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore --configuration Release
      
    #- name: Test
    #  run: dotnet test --no-build --verbosity normal

    
    # ✅ Set version dynamically
    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "VERSION=1.0.${{ github.run_number }}-pr${{ github.event.pull_request.number }}-${{ github.sha }}" >> $GITHUB_ENV
        else
          echo "VERSION=1.0.${{ github.run_number }}-${{ github.sha }}" >> $GITHUB_ENV
        fi

    # Pack with versioning + symbols
    - name: Pack
      run: |
        dotnet pack --no-build --configuration Release \
          -o ../../nupkgs \
          -p:Version=${VERSION} \
          -p:IncludeSymbols=true \
          -p:SymbolPackageFormat=snupkg
    
    # Upload both .nupkg and .snupkg
    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: |
          nupkgs/*.nupkg
          nupkgs/*.snupkg


